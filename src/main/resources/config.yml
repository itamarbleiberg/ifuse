configs:
  brewing_beam: true
  drain_cooldown: 60
  default_offhand_for_ability: false
  cant_unequip_while_on_cooldown: false
  only_allow_one_primary: false
  drop_effects_on_death: 1
  random_effect_on_join: false
  random_secondary_effect_on_join: false
  random_primary_effect_on_join: false
  roll_enable_ender: true
  roll_enable_apophis: true
  action_bar_update_time: 1
  event_update_time: 1
  apophis_enabled: true

  # Effects do nothing in these worlds
  disabled_worlds:
    - lobby

# ---------------------------------------------------------------------------------------------------------
# Rituals. Effects are crafted in a crafting table near a brewing stand (right-click a brewing stand).
# Each effect's own ritual settings (dimensions and ritual time) are under effect_settings.<effect>.ritual.
# ---------------------------------------------------------------------------------------------------------
rituals:
  # Only one ritual can run on the whole server at a time
  one_at_a_time: true
  # Right-clicking a brewing stand opens a crafting table instead of the brewing menu
  brewing_stand_opens_crafting: true

# How many augmented effects can be made per effect (the first crafts of each effect are augmented)
augments:
  emerald: 1
  feather: 1
  fire: 1
  frost: 1
  haste: 1
  heart: 1
  invis: 1
  ocean: 1
  regen: 1
  speed: 1
  strength: 1
  thunder: 1
  ender: 0
  apophis: 1

# How many normal effects can be crafted per effect after the augmented ones (-1 = unlimited)
effects:
  emerald: 3
  feather: 3
  fire: 3
  frost: 3
  haste: 3
  heart: 3
  invis: 3
  ocean: 3
  regen: 3
  speed: 3
  strength: 3
  thunder: 3
  ender: 1
  apophis: 1

damage:
