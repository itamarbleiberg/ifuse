# ---------------------------------------------------------------------------------------------------------
# Per-effect settings. You can also change these in-game with /infuseconfig (permission infuse.config).
#   particles.aura_enabled / aura_amount : particles around players who have the effect (shown about once a second)
#   particles.ability_percent            : % of the normal particle amount used by the spark ability (0 = none)
#   passives.<name>.enabled               : turn a passive on or off, the other numbers tune it (chances are in %)
#   ritual.dimensions                     : where the effect can be crafted: overworld, nether, end
#   ritual.normal_seconds                 : ritual time for the normal effect (0 = crafted instantly)
#   ritual.augmented_seconds              : ritual time for the augmented effect
# Spark (ability) cooldowns, durations, radius and damage are in the sections above.
# ---------------------------------------------------------------------------------------------------------
effect_settings:
  emerald:
    particles: {aura_enabled: true, aura_amount: 2, ability_percent: 100}
    passives:
      consumable_refund: {enabled: true, chance: 25, spark_chance: 50}
      throwable_refund: {enabled: true, chance: 25, spark_chance: 50}
      enchanting_table: {enabled: true}
      exp_boost: {enabled: true, multiplier: 1.5, spark_multiplier: 3.0}
      looting: {enabled: true, level: 5}
      luck: {enabled: true, level: 10}
      hero_of_the_village: {enabled: true, level: 3}
    ritual: {dimensions: [overworld, nether, end], normal_seconds: 0, augmented_seconds: 600}
  feather:
    particles: {aura_enabled: true, aura_amount: 2, ability_percent: 100}
    passives:
