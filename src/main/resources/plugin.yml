name: Infuse
version: '2.7'
main: me.poggercity.infuse.Managers.Infuse
api-version: '1.21.11'
authors: [ Pogger city ]
description: Infuse SMP THIS IS A TEST VERSION! WITH ALPHA FEATURES!

commands:
  giveselector:
    permission: op
  trust:
    usage: /trust
  untrust:
    usage: /untrust
  effects:
    permission: op
  augments:
    permission: op
  cooldown:
    description: Ends all ongoing cooldowns for the player or specified player.
    usage: /cooldown [player]
    permission: infuse.cooldown
  ldrain:
    description: Unequip an infuse.
  rdrain:
    description: Unequip an infuse.
  controls:
    description: Toggle controls between offhand and mainhand.
  reloadtrust:
    permission: op
  craftedeffects:
  cleareffect:
    description: Clear all hacks from a player.
    usage: /clearhack <player>
    permission: op
  lspark:
    description: Activates the first ability.
    usage: /ability1
  rspark:
    description: Activates the second ability.
    usage: /ability2
  swap:
    description: Swaps the hacks between slots 1 and 2.
    usage: /swap
  give_effects:
    description: Gives a player an effect item.
    usage: /give_effects <player> <effect>
    permission: infuse.giveeffects
  check_effects:
    description: Shows a player's two equipped effects (with colors).
    usage: /check_effects <player>
    permission: infuse.checkeffects
  start_ritual:
    description: Force-start an augmented ritual at a brewing stand.
    usage: /start_ritual <effectKey> [x y z]
    permission: infuse.startritual
  infuseconfig:
    description: Opens the in-game settings editor (everything in config.yml, and the recipes).
    usage: /infuseconfig [general|starting_effects|rituals|reload|<effect> [craft|spark|particles|passives|recipe]]
    aliases: [infusesettings]
    permission: infuse.config

permissions:
  infuse.config:
    description: Allows changing Infuse settings with /infuseconfig.
    default: op
  ability.use:
    description: Allows the player to use abilities.
    default: false
  infuse.update:
    default: op
  infuse.giveeffects:
    description: Allows using /give_effects to give players effect items.
    default: op
  infuse.checkeffects:
    description: Allows using /check_effects to view another player's effects.
    default: op
  infuse.startritual:
    description: Allows using /start_ritual to start a ritual.
    default: op
  infuse.givemace:
    description: Allows using /give_mace to give players Effect Axes.
    default: op